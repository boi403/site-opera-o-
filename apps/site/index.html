    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }

        /* Animações Customizadas */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-fade-up { animation: fadeInUp 0.8s ease-out forwards; }
        .animate-fade-left { animation: fadeInLeft 0.8s ease-out forwards; }
        .animate-fade-right { animation: fadeInRight 0.8s ease-out forwards; }
        .animate-scale { animation: scaleIn 0.8s ease-out forwards; }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }
        
        /* Garante que o estado inicial seja invisível antes da animação */
        .opacity-0-init { opacity: 0; }

        /* Custom Leaflet Styling */
        .leaflet-container {
            font-family: 'Inter', sans-serif !important;
            border-radius: 2.5rem;
            z-index: 1;
        }
        
        /* Popup Refinado */
        .custom-popup .leaflet-popup-content-wrapper {
            border-radius: 1.5rem;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .custom-popup .leaflet-popup-content {
            margin: 0;
            width: 320px !important;
        }
        .custom-popup .leaflet-popup-tip-container {
            display: none;
        }
        .leaflet-popup-close-button {
            top: 10px !important;
            right: 10px !important;
            color: white !important;
            background: rgba(0,0,0,0.3) !important;
            border-radius: 50% !important;
            width: 24px !important;
            height: 24px !important;
            line-height: 24px !important;
            z-index: 100;
        }
    </style>
